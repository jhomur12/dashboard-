<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Habi TV — Agentes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #7C3AED;
      --primary-light: #8B5CF6;
      --accent: #f39c12;
      --success: #27ae60;
      --warning: #e67e22;
      --danger: #e74c3c;
      --dark: #1a1a1a;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* TOPBAR */
    .topbar {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100px;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .topbar-logo {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 32px;
      color: #fff;
    }
    .topbar-title {
      display: flex;
      flex-direction: column;
    }
    .topbar-title h1 {
      font-size: 42px;
      font-weight: 700;
      color: #fff;
      margin: 0;
    }
    .topbar-title p {
      font-size: 20px;
      color: rgba(255,255,255,0.8);
      margin: 0;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .clock {
      font-size: 24px;
      color: rgba(255,255,255,0.9);
      font-weight: 600;
      font-family: 'SF Mono', Monaco, monospace;
    }
    .status-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #27ae60;
      animation: pulse 2s infinite;
      box-shadow: 0 0 16px rgba(39,174,96,0.5);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .btn {
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      text-transform: uppercase;
    }
    .btn-light {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .btn-light:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    /* MAIN */
    .main {
      padding: 40px;
      max-width: 1920px;
      margin: 0 auto;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--border);
    }
    .header h2 {
      font-size: 40px;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
    }
    .header-badge {
      font-size: 18px;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* FILTERS */
    .filter-bar {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--border);
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .filter-label {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .filter-tabs {
      display: flex;
      gap: 12px;
    }
    .filter-tab {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid var(--border);
      background: var(--card-bg);
      color: var(--text-secondary);
      transition: all 0.3s;
      text-transform: uppercase;
    }
    .filter-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
    }
    .filter-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 8px 16px rgba(124,58,237,0.3);
    }
    .agent-count {
      margin-left: auto;
      font-size: 20px;
      color: var(--text-secondary);
      font-weight: 700;
    }

    /* AGENT SEARCH */
    .agent-search {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 20px;
      outline: none;
      width: 400px;
      transition: all 0.3s;
      font-weight: 600;
    }
    .agent-search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 6px rgba(124,58,237,0.15);
    }

    /* TABLE */
    .table-container {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 28px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      text-align: left;
      border-bottom: 4px solid var(--primary);
    }
    th.r { text-align: right; }
    td {
      padding: 32px 24px;
      font-size: 28px;
      color: var(--text-secondary);
      border-bottom: 2px solid var(--border);
      font-weight: 600;
    }
    tr:hover td {
      background: rgba(124,58,237,0.05);
    }
    tr:last-child td { border-bottom: none; }
    td.r { text-align: right; }
    td.key {
      color: var(--text-primary);
      font-weight: 800;
      font-size: 30px;
    }

    /* BADGES */
    .badge {
      display: inline-block;
      font-size: 18px;
      font-weight: 800;
      border-radius: 8px;
      padding: 8px 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-front {
      background: #fff4e6;
      color: #f39c12;
      border: 2px solid #ffd699;
    }
    .badge-scraping {
      background: #e8f5e9;
      color: #27ae60;
      border: 2px solid #c8e6c9;
    }
    .badge-si {
      background: #e8f5e9;
      color: #27ae60;
      border: 2px solid #c8e6c9;
      font-size: 20px;
    }
    .badge-no {
      background: #ffebee;
      color: #e74c3c;
      border: 2px solid #ffcdd2;
      font-size: 20px;
    }

    /* PERCENTAGE COLORS */
    .pct-text {
      font-weight: 800;
      font-size: 30px;
    }
    .pct-green { color: var(--success); }
    .pct-yellow { color: var(--warning); }
    .pct-red { color: var(--danger); }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: var(--text-secondary);
      font-size: 32px;
    }

    /* RESPONSIVE TV */
    @media (min-width: 1920px) {
      .topbar { height: 120px; }
      .topbar-title h1 { font-size: 48px; }
      .topbar-title p { font-size: 24px; }
      th { font-size: 32px; padding: 36px 28px; }
      td { font-size: 32px; padding: 40px 28px; }
      td.key { font-size: 36px; }
      .header { padding: 40px; }
      .header h2 { font-size: 44px; }
    }

    /* SCROLLBAR STYLING */
    ::-webkit-scrollbar {
      width: 24px;
    }
    ::-webkit-scrollbar-track {
      background: #f3f4f6;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 12px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-light);
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo">🏠</div>
    <div class="topbar-title">
      <h1>HABI</h1>
      <p>Productividad en Tiempo Real</p>
    </div>
  </div>
  <div class="topbar-right">
    <div class="status-dot"></div>
    <span class="clock" id="clock">—:—:—</span>
    <button class="btn btn-light" onclick="loadAll()">↻ Actualizar</button>
  </div>
</div>

<div class="main">
  <div class="header">
    <h2>📊 Gestión por Agente</h2>
    <span class="header-badge" id="agent-date-badge">—</span>
  </div>

  <div class="filter-bar">
    <input class="agent-search" id="agent-search" type="text" placeholder="Buscar agente…" oninput="renderAgents()">
    
    <div class="filter-group">
      <span class="filter-label">Skill:</span>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterSkillAgent('all', this)">Todos</button>
        <button class="filter-tab" onclick="filterSkillAgent('FRONT', this)">Front</button>
        <button class="filter-tab" onclick="filterSkillAgent('SCRAPING', this)">Scraping</button>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">Asistencia:</span>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterAsistente('all', this)">Todos</button>
        <button class="filter-tab" onclick="filterAsistente('SI', this)">✓ Asisten</button>
        <button class="filter-tab" onclick="filterAsistente('NO', this)">✗ Ausentes</button>
      </div>
    </div>

    <span class="agent-count" id="agent-count"></span>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Skill</th>
          <th>Agente</th>
          <th class="r">Asiste</th>
          <th class="r">Completadas</th>
          <th class="r">Meta</th>
          <th class="r">Faltan</th>
          <th class="r">% Cumpl.</th>
        </tr>
      </thead>
      <tbody id="agent-tbody">
        <tr>
          <td colspan="7" style="text-align: center; color: var(--text-secondary); padding: 60px;">
            ⏳ Cargando agentes…
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzSXu4ygecMtbd6jkqa5J2aa4WWohC-c5zbdDXjfWUebLNx4H8TDt0D1T2p9V0Fz3ygbw/exec';

let agentData = [];
let agentSkillFilter = 'all';
let agentAsistFilter = 'all';

// CLOCK - Actualiza cada segundo
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleString('es-CO', {
    dateStyle: 'short',
    timeStyle: 'medium'
  });
}, 1000);

// FILTROS
function filterSkillAgent(skill, btn) {
  agentSkillFilter = skill;
  btn.closest('.filter-tabs').querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAgents();
}

function filterAsistente(val, btn) {
  agentAsistFilter = val;
  btn.closest('.filter-tabs').querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAgents();
}

// GOOGLE SHEETS
async function fetchSheet(sheet) {
  const res = await fetch(`${API}?sheet=${encodeURIComponent(sheet)}`);
  if (!res.ok) throw new Error('Error al cargar ' + sheet);
  return await res.json();
}

function toPercent(val) {
  const s = String(val).trim();
  if (s.includes('%')) return s;
  const n = parseFloat(s);
  if (!isNaN(n)) {
    return Math.round(n * 100) + '%';
  }
  return s;
}

function getTrafficColor(pct) {
  const val = parseFloat(String(pct).replace('%', '')) || 0;
  if (val >= 100) return 'green';
  if (val >= 80) return 'yellow';
  return 'red';
}

// CARGAR AGENTES
async function loadAgentes() {
  const r = await fetchSheet('X AGENTE');
  const fecha = r[0] && r[0][2] ? String(r[0][2]) : '—';
  document.getElementById('agent-date-badge').textContent = fecha;

  agentData = [];
  for (let i = 7; i < r.length; i++) {
    const row = r[i];
    if (!row || !row[1] || String(row[1]).trim() === '') continue;
    agentData.push({
      skill: String(row[0] || ''),
      agente: String(row[1] || ''),
      asiste: String(row[2] || ''),
      completadas: String(row[3] || ''),
      meta: String(row[4] || ''),
      faltan: String(row[5] || ''),
      pct: String(row[6] || '')
    });
  }
  renderAgents();
}

// RENDERIZAR TABLA
function renderAgents() {
  const search = (document.getElementById('agent-search').value || '').toLowerCase();
  const tbody = document.getElementById('agent-tbody');

  const rows = agentData.filter(a => {
    return (agentSkillFilter === 'all' || a.skill.toUpperCase() === agentSkillFilter)
      && (agentAsistFilter === 'all' || a.asiste.toUpperCase() === agentAsistFilter)
      && (!search || a.agente.toLowerCase().includes(search) || a.skill.toLowerCase().includes(search));
  });

  document.getElementById('agent-count').textContent = `${rows.length} agente${rows.length !== 1 ? 's' : ''}`;

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-secondary); padding: 60px;">Sin resultados</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(a => {
    const skillClass = a.skill.toUpperCase() === 'FRONT' ? 'badge-front' : 'badge-scraping';
    const asisColor = a.asiste.toUpperCase() === 'SI' ? 'badge-si' : 'badge-no';
    const pctVal = toPercent(a.pct);
    const pctCls = getTrafficColor(pctVal);

    return `<tr>
      <td><span class="badge ${skillClass}">${a.skill}</span></td>
      <td class="key">${a.agente}</td>
      <td class="r"><span class="badge ${asisColor}">${a.asiste}</span></td>
      <td class="r">${a.completadas}</td>
      <td class="r">${a.meta}</td>
      <td class="r">${a.faltan}</td>
      <td class="r pct-text pct-${pctCls}">${pctVal}</td>
    </tr>`;
  }).join('');
}

// CARGAR DATOS
async function loadAll() {
  try {
    await loadAgentes();
  } catch (e) {
    console.error('Error:', e);
  }
}

// ACTUALIZAR AUTOMÁTICAMENTE CADA 5 MINUTOS
setInterval(loadAll, 5 * 60 * 1000);
loadAll();
</script>

</body>
</html>
